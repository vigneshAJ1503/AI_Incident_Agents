name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint · typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest --cov=aiops --cov-report=term-missing

  discover-mcp-servers:
    name: discover MCP servers
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.list.outputs.servers }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "servers=$(ls -d mcp-servers/*/ | xargs -n1 basename | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  mcp-servers:
    name: mcp-servers (lint · typecheck · test)
    needs: discover-mcp-servers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.discover-mcp-servers.outputs.servers) }}
    defaults:
      run:
        working-directory: mcp-servers/${{ matrix.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: mcp-servers/${{ matrix.server }}/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Docker build
        run: docker build -t aiops/${{ matrix.server }}:ci .

  alert-rules:
    name: alert rules (promtool · amtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate + unit-test alert rules, validate alertmanager.yml
        run: make check-rules

  sample-services:
    name: sample-services (lint · typecheck · test · image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample-services
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: sample-services/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Docker build
        run: docker build -t aiops/sample-service:ci .
      - name: Kubernetes manifests render
        working-directory: .
        run: |
          kubectl kustomize deploy/k8s/base > /dev/null
          kubectl kustomize deploy/k8s/monitoring > /dev/null
          kubectl kustomize deploy/k8s/logging > /dev/null

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
