name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint · typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: test_portability_proof checks that the commit/PR which added the
          # Loki logs provider changed no agent or orchestrator code (PR-P4a).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest --cov=aiops --cov-report=term-missing
      - name: Docker build (API image, context = repo root)
        working-directory: .
        run: docker build -f backend/Dockerfile -t aiops/backend:ci .

  evals:
    name: evals (replay · zero tokens · regression gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked
      # Agents + planner cases + S0-S5 end to end, scored against scenarios/*/expected.yaml;
      # exit 1 when pass rate / root-cause accuracy drops or the false-positive rate rises
      # versus evals/baselines/replay.json (docs/evals.md).
      - name: System scorecard + regression gate
        run: uv run aiops evaluate --mode replay --profile local --out "$RUNNER_TEMP/scorecard"
      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-scorecard-replay
          path: ${{ runner.temp }}/scorecard
          retention-days: 14

  discover-mcp-servers:
    name: discover MCP servers
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.list.outputs.servers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: echo "servers=$(ls -d mcp-servers/*/ | xargs -n1 basename | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  mcp-servers:
    name: mcp-servers (lint · typecheck · test)
    needs: discover-mcp-servers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.discover-mcp-servers.outputs.servers) }}
    defaults:
      run:
        working-directory: mcp-servers/${{ matrix.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: mcp-servers/${{ matrix.server }}/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Docker build
        run: docker build -t aiops/${{ matrix.server }}:ci .

  alert-rules:
    name: alert rules (promtool · amtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate + unit-test alert rules, validate alertmanager.yml
        run: make check-rules

  sample-services:
    name: sample-services (lint · typecheck · test · image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample-services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: sample-services/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Docker build
        run: docker build -t aiops/sample-service:ci .
      - name: Kubernetes manifests render
        working-directory: .
        run: |
          kubectl kustomize deploy/k8s/base > /dev/null
          kubectl kustomize deploy/k8s/monitoring > /dev/null
          kubectl kustomize deploy/k8s/logging > /dev/null

  frontend:
    name: frontend (lint · typecheck · unit · build · e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (ESLint + Prettier)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Demo dataset is up to date
        run: npm run demo:generate && git diff --exit-code -- src/demo
      - name: Build (API mode)
        run: npm run build
      - name: Build (demo mode, for e2e)
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO: "1"
          NEXT_PUBLIC_DEMO_SPEED: "12"
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright, demo mode)
        run: npx playwright test
        env:
          CI: "1"
      - name: Docker build (web image, make demo)
        run: docker build -t aiops/web:ci .
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
