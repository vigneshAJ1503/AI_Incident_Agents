# Supply-chain security (PR-042): dependency audits and container image scans.
# gitleaks (secrets) runs in ci.yml. Accepted risks live in .github/security/ and .trivyignore,
# each with a reason and a review date (docs/security/threat-model.md "Residual risks").
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC: new CVEs in unchanged dependencies
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: discover Python projects and images
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: list
        run: |
          projects=$( (echo backend; echo sample-services; ls -d mcp-servers/*/ | sed 's:/$::') | jq -R . | jq -cs .)
          # name|dockerfile|context for every image we ship
          images=$( (echo "backend|backend/Dockerfile|."; echo "web|frontend/Dockerfile|frontend";
                     echo "sample-services|sample-services/Dockerfile|sample-services";
                     for d in mcp-servers/*/; do n=$(basename "$d"); echo "$n|mcp-servers/$n/Dockerfile|mcp-servers/$n"; done) \
                   | jq -R 'split("|") | {name: .[0], dockerfile: .[1], context: .[2]}' | jq -cs .)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  pip-audit:
    name: pip-audit (${{ matrix.project }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Audit the locked runtime dependencies
        run: ./scripts/pip-audit.sh "${{ matrix.project }}"

  npm-audit:
    name: npm audit (frontend, production deps, high+)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm audit --omit=dev --audit-level=high

  trivy:
    name: trivy (${{ matrix.image.name }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: docker build -f "${{ matrix.image.dockerfile }}" -t "aiops/${{ matrix.image.name }}:scan" "${{ matrix.image.context }}"
      - name: Scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: aiops/${{ matrix.image.name }}:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
