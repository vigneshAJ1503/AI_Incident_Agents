# Local development environment (MASTER_PLAN.md §10.1).
# Agents bind to capabilities, never to vendors. To onboard another environment,
# copy this file, change providers/URLs/field mappings, and set AIOPS_ENV.
# ${VAR} = required env var, ${VAR:-default} = optional.

environment: local
service_catalog: local

llm:
  provider: ${LLM_PROVIDER:-openai_compat}   # openai_compat (hosted Groq/Gemini) | fake
  base_url: ${OPENAI_COMPAT_BASE_URL:-https://api.groq.com/openai/v1}
  api_key: ${OPENAI_COMPAT_API_KEY:-}
  models:
    fast: ${LLM_MODEL_FAST:-}
    agent: ${LLM_MODEL_AGENT:-}
    rca: ${LLM_MODEL_RCA:-}
  timeout_s: 60
  max_retries: 4

limits:
  max_steps: 8
  max_tool_calls: 10
  max_execution_s: 60
  max_tokens: 60000

guardrails:
  read_only: true
  redact: [emails, ip_addresses, jwt, bearer_tokens, api_keys, credit_cards]
  max_tool_output_chars: 8000
  audit_log_path: .data/audit.jsonl
  # Write actions need a human approval (aiops approvals ...). Agents are always read-only.
  approvals_path: .data/approvals.json
  approvals_audit_path: .data/approvals-audit.jsonl
  approval_ttl_hours: 24

capabilities:
  logs:
    provider: elasticsearch
    mcp:
      transport: http
      url: ${LOGS_MCP_URL:-http://localhost:8101/mcp}
      timeout_s: 30
    tool_allowlist: [list_indices, get_mapping, search_logs, execute_esql]
    limits:
      max_results: 1000
      max_time_range_hours: 48
      query_timeout_s: 30
    settings:
      # Field mapping = portability. Change these to match another company's log schema.
      fields:
        timestamp: "@timestamp"
        level: level
        message: message
        message_keyword: message.keyword
        service: service
        environment: environment
        trace_id: trace_id
        status_code: status_code
        endpoint: endpoint
        version: version
        error_type: error_type
      error_levels: [ERROR, FATAL, CRITICAL]
      pattern_levels: [ERROR, FATAL, CRITICAL, WARN]   # levels considered for pattern analysis
      baseline_hours: 24                               # "is this normal?" comparison window
      startup_pattern: "Starting*"                     # app startup lines -> deployments/restarts
      ui_link_template: "${KIBANA_URL:-http://localhost:5601}/app/discover#/?_g=(time:(from:'{start}',to:'{end}'))&_a=(query:(language:kuery,query:'{kql}'))"

  knowledge:
    provider: postgres_fts          # markdown runbooks -> Postgres full-text search (no models)
    mcp:
      transport: http
      url: ${KNOWLEDGE_MCP_URL:-http://localhost:8108/mcp}
      timeout_s: 15
    tool_allowlist: [search, get_doc, list_docs]
    limits:
      max_results: 10
      query_timeout_s: 10
    settings:
      # Where a cited doc opens: {path} is repo-relative, e.g. knowledge-base/runbooks/redis-outage.md
      ui_link_template: "https://github.com/vigneshAJ1503/AI_Incident_Agents/blob/main/{path}"
      search_k: 8          # sections per search (server caps at 10)
      top_docs: 3          # relevant runbooks fetched and cited

  tickets:
    # mock = mock-tickets-mcp (offline, Postgres, default) | jira = mcp-atlassian on a Jira
    # Cloud site. Both expose the same tool names and shapes. To switch (docs/setup/jira.md):
    #   TICKETS_PROVIDER=jira TICKETS_MCP_URL=http://localhost:8102/mcp
    #   TICKETS_UI_URL=https://<your-site>.atlassian.net
    provider: ${TICKETS_PROVIDER:-mock}
    mcp:
      transport: http
      url: ${TICKETS_MCP_URL:-http://localhost:8109/mcp}
      timeout_s: 30
    # Read-only: agents never see write tools (create/comment/update go through approvals).
    tool_allowlist: [jira_search, jira_get_issue]
    # Write tools: NEVER given to agents. Only `aiops approvals approve` executes them, for a
    # proposal a human approved (core/guardrails/approvals.py).
    write_allowlist: [jira_create_issue, jira_add_comment, jira_update_issue]
    limits:
      max_results: 20
      query_timeout_s: 30
    settings:
      project_key: ${TICKETS_PROJECT_KEY:-OPS}
      write_requires_approval: true
      resolved_lookback_days: 90    # "similar past incident" = resolved within this window
      # Optional: replace the agent's symptom vocabulary (name: {triggers: regex, search: [terms]})
      # symptom_terms: { timeout: { triggers: "time[ds]? ?outs?", search: [timeout] } }
      # {key} = issue key. Mock: a minimal page served by mock-tickets-mcp.
      ui_link_template: "${TICKETS_UI_URL:-http://localhost:8109}/browse/{key}"

  alerts:
    provider: alertmanager
    mcp:
      transport: http
      url: ${ALERTS_MCP_URL:-http://localhost:8105/mcp}
      timeout_s: 20
    # Read-only by construction (alertmanager-mcp has no write tools).
    tool_allowlist: [list_alerts, get_alert, list_silences, get_alert_groups, alert_history]
    limits:
      max_results: 200
      max_time_range_hours: 168
      query_timeout_s: 15
    settings:
      # Alert label names = portability. Change them to match another company's rules.
      labels:
        service: service
        severity: severity
        alertname: alertname
      critical_severities: [critical, page, P1]
      ui_link_template: "${ALERTMANAGER_URL:-http://localhost:9093}/#/alerts?silenced=false&inhibited=false&filter={filter}"
  k8s:
    provider: kubernetes               # own read-only kubernetes-mcp (ADR-0008)
    mcp:
      transport: http
      url: ${K8S_MCP_URL:-http://localhost:8106/mcp}
      timeout_s: 20
    # Read-only by construction (no write/exec/secret tools on the server) AND by RBAC
    # (the aiops-reader ServiceAccount only has get/list/watch, deploy/k8s/rbac).
    tool_allowlist:
      [list_namespaces, list_pods, get_pod, list_events, list_deployments, get_deployment,
       get_pod_logs, list_services]
    limits:
      max_results: 200
      max_time_range_hours: 48
      query_timeout_s: 15
    settings:
      # Deployment, label selector, container and namespace per service come from the
      # service catalog (k8s: {deployment, label_selector, container, namespace}).
      default_namespace: prod
      # Dependencies (catalog depends_on) that aren't catalog services: deployment = name.
      include_dependencies: true
      # Deep link for evidence, e.g. a Lens/Headlamp/cloud console URL. Unset locally.
      # {namespace} {kind} {name} are filled in.
      ui_link_template: ${K8S_UI_LINK_TEMPLATE:-}
  code:
    provider: git                      # local git-mcp (ADR-0007); github/gitlab in companies
    mcp:
      transport: http
      url: ${CODE_MCP_URL:-http://localhost:8107/mcp}
      timeout_s: 30
    tool_allowlist: [list_repositories, list_releases, search_commits, get_commit, get_diff]
    limits:
      max_results: 200
      max_time_range_hours: 2160
      query_timeout_s: 20
    settings:
      # Repo names and paths per service come from the service catalog (code: {repo, paths}).
      lookback_hours: 24                       # scan [incident start - 24h, incident end]
      release_tag_template: "{service}/{version}"
      max_diffs: 3                             # diffs fetched for the top suspects
      suspect_threshold: 0.3                   # risk score (0..1) to report a commit
      include_dependencies: true               # also scan catalog depends_on services (weighted)
      # Commit deep link, e.g. "https://github.com/acme/{repo}/commit/{sha}". Unset locally.
      ui_link_template: ${CODE_UI_LINK_TEMPLATE:-}

agents:
  logs:
    model_role: agent
    # 4 deterministic queries + up to 6 LLM-driven follow-ups (MASTER_PLAN PR-010 limits)
    limits:
      max_steps: 6
      max_tool_calls: 10
      max_execution_s: 60
      max_tokens: 40000
  tickets:
    model_role: agent
    # 1-3 deterministic searches (a labels-only retry if Jira rejects a component) + up to
    # 3 LLM follow-ups (e.g. jira_get_issue for comments)
    limits:
      max_steps: 4
      max_tool_calls: 6
      max_execution_s: 45
      max_tokens: 30000
  knowledge:
    model_role: agent
    # list_docs + up to 4 searches + up to 4 get_doc (deterministic), then <= 2 LLM follow-ups
    limits:
      max_steps: 4
      max_tool_calls: 12
      max_execution_s: 45
      max_tokens: 30000
  alerts:
    model_role: agent
    # service alerts + one call per depends_on service + silences (deterministic, <= ~6),
    # then <= 2 LLM follow-ups (get_alert, get_alert_groups, ...)
    limits:
      max_steps: 4
      max_tool_calls: 10
      max_execution_s: 45
      max_tokens: 30000
  code:
    model_role: agent
    # 2 deterministic calls (releases, commits) + up to 3 diffs + up to 5 LLM follow-ups
    limits:
      max_steps: 6
      max_tool_calls: 10
      max_execution_s: 60
      max_tokens: 40000
