# Dashboards as code (PR-020): every JSON file in config/grafana/dashboards is loaded
# into the "AI Incident Agents" folder. Edit the JSON in git, not in the UI.
apiVersion: 1

providers:
  - name: aiops
    folder: AI Incident Agents
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
