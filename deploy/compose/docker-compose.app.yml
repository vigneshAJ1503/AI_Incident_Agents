# The aiops API (PR-035) + the Web UI (PR-039) as containers. Opt-in: NOT started by `make infra-up`.
#   make demo       (Postgres + seeded demo data + api + web + mock-tickets-mcp: docs/setup/demo.md)
#   make api-up     (api + web; needs make infra-up; the MCP servers for live mode: make mcp-up)
#   make api-down
# Joins the network created by docker-compose.infra.yml; port bound to 127.0.0.1 only.
# Inside the network, capabilities are reached by container name, not localhost.

name: aiops-app

services:
  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: aiops/backend:0.1.0
    container_name: aiops-api
    environment:
      - AIOPS_PROFILE=${AIOPS_PROFILE:-local}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-aiops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aiops-local-only}
      - POSTGRES_DB=${POSTGRES_DB:-aiops}
      - LOGS_MCP_URL=http://aiops-elasticsearch-mcp:8101/mcp
      - METRICS_MCP_URL=http://aiops-prometheus-mcp:8103/mcp
      - ALERTS_MCP_URL=http://aiops-alertmanager-mcp:8105/mcp
      - K8S_MCP_URL=http://aiops-kubernetes-mcp:8106/mcp
      - CODE_MCP_URL=http://aiops-git-mcp:8107/mcp
      - KNOWLEDGE_MCP_URL=http://aiops-knowledge-mcp:8108/mcp
      - TICKETS_MCP_URL=${TICKETS_MCP_URL_IN_NETWORK:-http://aiops-mock-tickets-mcp:8109/mcp}
      # Optional: a hosted LLM key enables live mode (else replays; docs/api/README.md).
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compat}
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-https://api.groq.com/openai/v1}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - OPENAI_COMPAT_API_KEY_2=${OPENAI_COMPAT_API_KEY_2:-}
      - LLM_MODEL_FAST=${LLM_MODEL_FAST:-}
      - LLM_MODEL_AGENT=${LLM_MODEL_AGENT:-}
      - LLM_MODEL_RCA=${LLM_MODEL_RCA:-}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-}
      # real = replays reason with the configured LLM (recorded data, real reasoning)
      - AIOPS_REPLAY_LLM=${AIOPS_REPLAY_LLM:-}
      - AIOPS_API_KEY=${AIOPS_API_KEY:-}
      - AIOPS_API_KEYS=${AIOPS_API_KEYS:-}
      # Replays started from the Web UI: seconds per recorded tool call, so the live view
      # unfolds at a watchable pace (0 = instant). make demo: docs/setup/demo.md
      - AIOPS_REPLAY_TOOL_DELAY_S=${AIOPS_REPLAY_TOOL_DELAY_S:-0.5}
      # PR-041: OpenTelemetry traces (off when empty). With `make tracing-up`:
      # AIOPS_OTLP_ENDPOINT_IN_NETWORK=http://aiops-jaeger:4318. /metrics is always served.
      - AIOPS_OTLP_ENDPOINT=${AIOPS_OTLP_ENDPOINT_IN_NETWORK:-}
      - AIOPS_API_CORS_ORIGINS=${AIOPS_API_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - api-data:/app/.data   # file-based approvals + audit log (profile guardrails.*)
    mem_limit: 320m   # measured ~120 MiB idle and after a replay investigation
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  # The Web UI (PR-039). The browser only talks to it (http://localhost:3100); its /api/* route
  # proxies REST + SSE to the api service by container name (frontend/src/app/api/[...path]).
  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: aiops/web:0.1.0
    container_name: aiops-web
    environment:
      # make demo-live runs the API on the host (fault injection needs kubectl):
      # AIOPS_API_INTERNAL_URL=http://host.docker.internal:8000
      - AIOPS_API_INTERNAL_URL=${AIOPS_API_INTERNAL_URL:-http://aiops-api:8000}
      # Server-side X-API-Key the proxy adds when the API requires one (never sent to the
      # browser). Use a named key (AIOPS_API_KEYS=name:KEY) so UI approvals have an identity.
      - AIOPS_UI_API_KEY=${AIOPS_UI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; Docker Desktop provides it already
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3100"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 192m   # measured in docs/setup/demo.md
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /app/.next/cache:size=32m,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  api-data:

networks:
  default:
    name: aiops
    external: true   # created by scripts/ensure-network.sh (make infra-up)
