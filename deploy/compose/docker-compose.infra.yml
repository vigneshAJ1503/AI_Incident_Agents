# Local data + logging stack (MASTER_PLAN.md §9, PR-007).
# All ports bind to 127.0.0.1 only. Security is disabled for LOCAL development only.
# Versions are pinned in ../../.env.example (never :latest).

name: aiops

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.19.4}
    container_name: aiops-elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.name=aiops-local
      - xpack.security.enabled=false
      - action.destructive_requires_name=true
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: ${ES_MEM_LIMIT:-1280m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION:-8.19.4}
    container_name: aiops-kibana
    profiles: ["ui"]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TELEMETRY_OPTIN=false
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    mem_limit: 1g
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 40s

  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: aiops-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aiops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aiops-local-only}
      - POSTGRES_DB=${POSTGRES_DB:-aiops}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    container_name: aiops-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # PR-023. Real alerts come from Prometheus (PR-020), which evaluates
  # config/prometheus/alert-rules.yml against the live cluster. `make seed-alerts S=S1`
  # still posts synthetic alerts for the Alert agent's fixed-time evals (docs/setup/alerts.md).
  # Alerts live in memory only: a restart drops them (silences survive in the am-data volume).
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.34.1}
    container_name: aiops-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
      - --web.external-url=${ALERTMANAGER_URL:-http://localhost:9093}
      - --cluster.listen-address=   # single instance, no gossip
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am-data:/alertmanager
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  # PR-020. Scrapes the sample services and kube-state-metrics in Minikube through their
  # NodePorts, evaluates config/prometheus/alert-rules.yml and sends alerts to Alertmanager.
  # Lean: 30 s scrapes (prometheus.yml), 2 days / 512 MB of data.
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.0}
    container_name: aiops-prometheus
    user: "65534:65534"   # nobody (the image default, made explicit)
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-2d}
      - --storage.tsdb.retention.size=512MB
      - --web.listen-address=:9090
      - --web.external-url=${PROMETHEUS_URL:-http://localhost:9090}
      - --query.timeout=30s
      - --query.max-samples=5000000
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alert-rules.yml:/etc/prometheus/rules/alert-rules.yml:ro
      - prom-data:/prometheus
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-256m}
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  # PR-020. Optional UI (`make ui-up`): dashboards over Prometheus and Elasticsearch,
  # provisioned from config/grafana. Agents never need it; they build deep links instead.
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.2}
    container_name: aiops-grafana
    profiles: ["ui"]
    user: "472:0"   # the image's grafana user (numeric)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-aiops-local-only}
      # Local only (127.0.0.1): read-only anonymous viewers, so deep links open directly.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_SERVER_ROOT_URL=${GRAFANA_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 320m   # ~200 MB in use with both dashboards open
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health | grep -q ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

volumes:
  es-data:
  pg-data:
  am-data:
  prom-data:
  grafana-data:

networks:
  default:
    name: aiops
    external: true   # created by scripts/ensure-network.sh (pinned subnet, survives `down`)
