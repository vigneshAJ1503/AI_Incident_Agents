# MCP servers (PR-008+). Joins the network created by docker-compose.infra.yml.
# Ports bind to 127.0.0.1 only.

name: aiops-mcp

services:
  elasticsearch-mcp:
    build:
      context: ../../mcp-servers/elasticsearch-mcp
    image: aiops/elasticsearch-mcp:0.1.0
    container_name: aiops-elasticsearch-mcp
    environment:
      - ES_URL=http://elasticsearch:9200
      - ALLOWED_INDEX_PATTERNS=${LOGS_ALLOWED_INDEX_PATTERNS:-payment-prod-*,order-prod-*,user-prod-*,inventory-prod-*,payment-staging-*,order-staging-*,user-staging-*,inventory-staging-*,logs-k8s-*}
      - MAX_TIME_RANGE_HOURS=${LOGS_MAX_TIME_RANGE_HOURS:-48}
      - MAX_RESULTS=${LOGS_MAX_RESULTS:-1000}
      - QUERY_TIMEOUT_S=${LOGS_QUERY_TIMEOUT_S:-30}
    ports:
      - "127.0.0.1:${LOGS_MCP_PORT:-8101}:8101"
    mem_limit: 256m
    restart: unless-stopped

  knowledge-mcp:
    build:
      context: ../../mcp-servers/knowledge-mcp
    image: aiops/knowledge-mcp:0.1.0
    container_name: aiops-knowledge-mcp
    environment:
      # libpq settings; the server only ever opens read-only transactions (see its README).
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-aiops}
      - PGPASSWORD=${POSTGRES_PASSWORD:-aiops-local-only}
      - PGDATABASE=${POSTGRES_DB:-aiops}
      - KNOWLEDGE_SCHEMA=${KNOWLEDGE_SCHEMA:-knowledge}
      - MAX_K=${KNOWLEDGE_MAX_K:-10}
      - STATEMENT_TIMEOUT_MS=${KNOWLEDGE_STATEMENT_TIMEOUT_MS:-5000}
    ports:
      - "127.0.0.1:${KNOWLEDGE_MCP_PORT:-8108}:8108"
    mem_limit: 192m
    restart: unless-stopped

  # Offline Jira stand-in (PR-012): mcp-atlassian's Jira tool names, backed by Postgres
  # schema `tickets`. The default `tickets` provider locally and in CI.
  mock-tickets-mcp:
    build:
      context: ../../mcp-servers/mock-tickets-mcp
    image: aiops/mock-tickets-mcp:0.1.0
    container_name: aiops-mock-tickets-mcp
    environment:
      - TICKETS_STORE=postgres
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${POSTGRES_USER:-aiops}
      - PG_PASSWORD=${POSTGRES_PASSWORD:-aiops-local-only}
      - PG_DATABASE=${POSTGRES_DB:-aiops}
      - TICKETS_SCHEMA=tickets
      - ALLOWED_PROJECTS=${TICKETS_ALLOWED_PROJECTS:-OPS}
      - READ_ONLY_MODE=${TICKETS_READ_ONLY_MODE:-false}
      - BASE_URL=http://localhost:${MOCK_TICKETS_MCP_PORT:-8109}
    ports:
      - "127.0.0.1:${MOCK_TICKETS_MCP_PORT:-8109}:8109"
    mem_limit: 256m
    restart: unless-stopped

  # Real Jira Cloud via sooperset/mcp-atlassian (PR-012). Opt-in: needs a Jira Cloud site
  # and an API token in .env (docs/setup/jira.md). Start with:
  #   docker compose --env-file .env -f deploy/compose/docker-compose.mcp.yml --profile jira up -d jira-mcp
  # ENABLED_TOOLS limits the server to the tools we use; agents additionally only get the
  # read tools (capability allowlist), writes go through `aiops approvals`.
  jira-mcp:
    profiles: ["jira"]
    image: ghcr.io/sooperset/mcp-atlassian:${MCP_ATLASSIAN_VERSION:-0.23.1}
    container_name: aiops-jira-mcp
    command: ["--transport", "streamable-http", "--port", "8000", "--host", "0.0.0.0"]
    environment:
      - JIRA_URL=${JIRA_URL:-}
      - JIRA_USERNAME=${JIRA_USERNAME:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - JIRA_PROJECTS_FILTER=${TICKETS_ALLOWED_PROJECTS:-OPS}
      - ENABLED_TOOLS=jira_search,jira_get_issue,jira_create_issue,jira_add_comment,jira_update_issue
      - READ_ONLY_MODE=${TICKETS_READ_ONLY_MODE:-false}
    ports:
      - "127.0.0.1:${JIRA_MCP_PORT:-8102}:8000"
    mem_limit: 512m
    restart: unless-stopped

  alertmanager-mcp:
    build:
      context: ../../mcp-servers/alertmanager-mcp
    image: aiops/alertmanager-mcp:0.1.0
    container_name: aiops-alertmanager-mcp
    environment:
      - AM_URL=http://alertmanager:9093
      - MAX_RESULTS=${ALERTS_MAX_RESULTS:-200}
      - MAX_TIME_RANGE_HOURS=${ALERTS_MAX_TIME_RANGE_HOURS:-168}
      - QUERY_TIMEOUT_S=${ALERTS_QUERY_TIMEOUT_S:-15}
    ports:
      - "127.0.0.1:${ALERTS_MCP_PORT:-8105}:8105"
    mem_limit: 128m
  git-mcp:
    build:
      context: ../../mcp-servers/git-mcp
    image: aiops/git-mcp:0.1.0
    container_name: aiops-git-mcp
    environment:
      - GIT_REPOS=sample-repo=/repos/sample-repo
      - MAX_COMMITS=${CODE_MAX_COMMITS:-200}
      - MAX_DIFF_CHARS=${CODE_MAX_DIFF_CHARS:-40000}
      - MAX_RANGE_DAYS=${CODE_MAX_RANGE_DAYS:-90}
    volumes:
      # Build it first: make seed-repo S=S1. Rebuilds are visible without a restart.
      - ${CODE_SAMPLE_REPO_DIR:-../../.data/sample-repo}:/repos/sample-repo:ro
    ports:
      - "127.0.0.1:${CODE_MCP_PORT:-8107}:8107"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    restart: unless-stopped

  # Read-only Kubernetes access (PR-018, ADR-0008) as the aiops-reader ServiceAccount.
  # Create the kubeconfig first: make k8s-reader-kubeconfig (token in .data/, git-ignored).
  # The API server is the Minikube node on the aiops network (https://172.21.0.100:8443).
  kubernetes-mcp:
    build:
      context: ../../mcp-servers/kubernetes-mcp
    image: aiops/kubernetes-mcp:0.1.0
    container_name: aiops-kubernetes-mcp
    environment:
      - KUBECONFIG=/etc/aiops/kubeconfig
      - ALLOWED_NAMESPACES=${K8S_ALLOWED_NAMESPACES:-prod}
      - MAX_RESULTS=${K8S_MAX_RESULTS:-200}
      - MAX_LOG_LINES=${K8S_MAX_LOG_LINES:-300}
      - MAX_SINCE_HOURS=${K8S_MAX_SINCE_HOURS:-48}
      - QUERY_TIMEOUT_S=${K8S_QUERY_TIMEOUT_S:-15}
    volumes:
      - ${K8S_READER_KUBECONFIG_FILE:-../../.data/k8s/aiops-reader.kubeconfig}:/etc/aiops/kubeconfig:ro
    ports:
      - "127.0.0.1:${K8S_MCP_PORT:-8106}:8106"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    restart: unless-stopped

networks:
  default:
    name: aiops
    external: true
