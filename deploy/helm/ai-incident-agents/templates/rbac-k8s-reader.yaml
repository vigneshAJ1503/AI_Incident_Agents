{{- if .Values.mcpServers.kubernetes.enabled }}
{{- $fullname := include "aiops.fullname" . }}
{{- $reader := printf "%s-k8s-reader" $fullname }}
# Read-only Kubernetes identity of the k8s capability (ADR-0008), only when its MCP server runs.
# Least privilege: get/list/watch on workload objects in k8sReader.namespaces (RoleBindings),
# plus optional read of nodes and namespaces. Deliberately NOT granted: secrets, configmaps,
# pods/exec, pods/attach, pods/portforward, serviceaccounts/token, and every write verb.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $reader }}
  labels:
    {{- include "aiops.componentLabels" (list . "mcp-kubernetes") | nindent 4 }}
automountServiceAccountToken: false   # mounted explicitly by the kubernetes MCP pod only
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s-workloads" .Release.Namespace $reader | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "aiops.componentLabels" (list . "mcp-kubernetes") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
{{- range .Values.k8sReader.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s" $.Release.Namespace $reader | trunc 63 | trimSuffix "-" }}
  namespace: {{ . }}
  labels:
    {{- include "aiops.componentLabels" (list $ "mcp-kubernetes") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s-workloads" $.Release.Namespace $reader | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ $reader }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if .Values.k8sReader.clusterRead }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s-cluster" .Release.Namespace $reader | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "aiops.componentLabels" (list . "mcp-kubernetes") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-cluster" .Release.Namespace $reader | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "aiops.componentLabels" (list . "mcp-kubernetes") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s-cluster" .Release.Namespace $reader | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ $reader }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
