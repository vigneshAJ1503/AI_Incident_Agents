{{- if .Values.web.enabled }}
# The Web UI (Next.js standalone). The browser only talks to it: /api/* is proxied (REST + SSE)
# to the API service, so this is the only component to expose (port-forward or the Ingress).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiops.fullname" . }}-web
  labels:
    {{- include "aiops.componentLabels" (list . "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "aiops.selectorLabels" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aiops.componentLabels" (list . "web") | nindent 8 }}
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aiops.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with include "aiops.imagePullSecrets" . }}{{ . | trim | nindent 6 }}{{- end }}
      {{- include "aiops.podSecurityContext" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "aiops.image" (list . .Values.web.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "aiops.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 3100
          env:
            - name: AIOPS_API_INTERNAL_URL
              value: {{ printf "http://%s-api:%v" (include "aiops.fullname" .) .Values.api.service.port | quote }}
            {{- if .Values.web.apiKeySecret.name }}
            - name: AIOPS_UI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.web.apiKeySecret.name }}
                  key: {{ .Values.web.apiKeySecret.key }}
            {{- end }}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          # Read-only root FS: only /tmp and the Next.js cache are writable.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: next-cache
          emptyDir: {sizeLimit: 64Mi}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops.fullname" . }}-web
  labels:
    {{- include "aiops.componentLabels" (list . "web") | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "aiops.selectorLabels" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
{{- end }}
