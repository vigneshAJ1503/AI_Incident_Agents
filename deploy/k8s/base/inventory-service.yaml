# inventory-service. Fault flags live in the ConfigMap (PR-017 changes them to inject incidents).
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-service-config
  labels: { app: inventory-service }
data:
  APP_VERSION: "v1.4.2"
  TEAM: "commerce"
  ENVIRONMENT: "production"
  DB_POOL_SIZE: "10"
  DB_TIMEOUT_MS: "5000"
  SLOW_QUERY_MS: "20"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels: { app: inventory-service, team: commerce }
spec:
  replicas: 1
  selector: { matchLabels: { app: inventory-service } }
  template:
    metadata:
      labels: { app: inventory-service, team: commerce }
    spec:
      containers:
        - name: app
          image: aiops/sample-service:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_NAME, value: inventory-service }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-db, key: DATABASE_URL } }
          envFrom: [{ configMapRef: { name: inventory-service-config } }]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { memory: 64Mi, cpu: 25m }
            limits: { memory: 160Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  labels: { app: inventory-service, team: commerce }
  annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080" }
spec:
  type: NodePort
  selector: { app: inventory-service }
  ports: [{ name: http, port: 8080, targetPort: http, nodePort: 30084 }]
