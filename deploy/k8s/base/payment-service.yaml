# payment-service. Fault flags live in the ConfigMap (PR-017 changes them to inject incidents).
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  labels: { app: payment-service }
data:
  APP_VERSION: "v1.8.1"
  TEAM: "payments"
  ENVIRONMENT: "production"
  DB_POOL_SIZE: "20"
  DB_TIMEOUT_MS: "5000"
  DB_HOLD_MS: "800"
  REDIS_URL: "redis://redis:6379/0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels: { app: payment-service, team: payments }
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-service } }
  template:
    metadata:
      labels: { app: payment-service, team: payments }
    spec:
      containers:
        - name: app
          image: aiops/sample-service:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_NAME, value: payment-service }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-db, key: DATABASE_URL } }
          envFrom: [{ configMapRef: { name: payment-service-config } }]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { memory: 64Mi, cpu: 25m }
            limits: { memory: 160Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels: { app: payment-service, team: payments }
  annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080" }
spec:
  type: NodePort
  selector: { app: payment-service }
  ports: [{ name: http, port: 8080, targetPort: http, nodePort: 30081 }]
