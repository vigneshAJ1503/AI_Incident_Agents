# Fluent Bit on every node, shipping namespace `prod` container logs to Elasticsearch.
#
# Why root (UID 0): kubelet writes /var/log/pods/* as root:root 0640 in dirs 0750, so a
# non-root UID can't read them (and non-root processes don't get file capabilities).
# The blast radius is kept small instead: ALL capabilities dropped (root only reads files
# it owns), no privilege escalation, a read-only root filesystem, /var/log mounted
# read-only, and the only writable host path is Fluent Bit's own offset DB directory.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels: { app: fluent-bit }
spec:
  selector: { matchLabels: { app: fluent-bit } }
  updateStrategy: { type: RollingUpdate }
  template:
    metadata:
      labels: { app: fluent-bit }
    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: fluent-bit
          # Pinned (verified with `docker manifest inspect`); never :latest.
          image: fluent/fluent-bit:5.1.2
          imagePullPolicy: IfNotPresent
          args: ["--config=/fluent-bit/etc/fluent-bit.conf"]
          ports: [{ name: http, containerPort: 2020 }]
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 64Mi }
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /fluent-bit/etc, readOnly: true }
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: state, mountPath: /var/lib/fluent-bit }
      volumes:
        - name: config
          configMap: { name: fluent-bit-config }
        - name: varlog
          hostPath: { path: /var/log, type: Directory }
        - name: state
          hostPath: { path: /var/lib/aiops-fluent-bit, type: DirectoryOrCreate }
