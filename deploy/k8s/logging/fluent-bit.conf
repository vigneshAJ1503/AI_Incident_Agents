# Fluent Bit pipeline (PR-016, docs/setup/logging.md):
#   tail (CRI) -> kubernetes metadata -> lift the app's JSON to top level -> Elasticsearch
[SERVICE]
    Flush           2
    Log_Level       info
    Parsers_File    parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020
    Health_Check    On

[INPUT]
    Name              tail
    Tag               kube.*
    # Only the sample system (namespace prod): kube-system noise would waste ES memory.
    Path              /var/log/containers/*_prod_*.log
    multiline.parser  cri
    # Offsets survive pod restarts (hostPath), so a restart neither re-ships nor skips lines.
    DB                /var/lib/fluent-bit/tail.db
    DB.locking        true
    Read_from_Head    On
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  5

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           Off
    Keep_Log            On
    Labels              On
    Annotations         Off

# Lift the app's JSON fields to the top level (the same fields as the synthetic logs).
# Lines that aren't JSON (Postgres, Redis) keep their raw text in `log`.
[FILTER]
    Name          parser
    Match         kube.*
    Key_Name      log
    Parser        app_json
    Reserve_Data  On
    Preserve_Key  Off

# CRI envelope fields nobody queries.
[FILTER]
    Name    modify
    Match   kube.*
    Remove  _p
    Remove  time
    Remove  stream

[OUTPUT]
    Name                es
    Match               kube.*
    Host                aiops-elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     logs-k8s
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name  On
    Replace_Dots        On
    Trace_Error         On
    Retry_Limit         5
