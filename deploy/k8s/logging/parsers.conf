# The sample services log one JSON object per line (same schema as the synthetic logs).
# Its `@timestamp` becomes the record time; the es output writes it back as `@timestamp`
# (and picks the daily index from it).
[PARSER]
    Name        app_json
    Format      json
    Time_Key    @timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   Off
