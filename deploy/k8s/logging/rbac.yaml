# Minimal read-only access for Fluent Bit's kubernetes filter (pod/namespace metadata).
# No secrets, no writes, no exec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  labels: { app: fluent-bit }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiops-fluent-bit-read
  labels: { app: fluent-bit }
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-fluent-bit-read
  labels: { app: fluent-bit }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aiops-fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging
