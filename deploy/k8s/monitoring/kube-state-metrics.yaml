# kube-state-metrics (PR-020): object state (pod restarts, last termination reason,
# deployment replicas, labels) for the rules in deploy/compose/config/prometheus/alert-rules.yml.
#
# Lean on purpose: only the `prod` namespace and only the pods + deployments collectors,
# with the app/team labels the alert rules join on (kube_pod_labels, kube_deployment_labels).
# Read-only RBAC: list/watch on those two resources, nothing else.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels: { app.kubernetes.io/part-of: aiops }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiops-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aiops-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: { app: kube-state-metrics, team: platform }
spec:
  replicas: 1
  selector: { matchLabels: { app: kube-state-metrics } }
  template:
    metadata:
      labels: { app: kube-state-metrics, team: platform }
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            - --port=8080
            - --telemetry-port=8081
            - --namespaces=prod
            - --resources=pods,deployments
            - --metric-labels-allowlist=pods=[app,team],deployments=[app,team]
          ports:
            - { name: http-metrics, containerPort: 8080 }
            - { name: telemetry, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: telemetry }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: http-metrics }
            periodSeconds: 20
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 96Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: { app: kube-state-metrics }
spec:
  type: NodePort
  selector: { app: kube-state-metrics }
  ports: [{ name: http-metrics, port: 8080, targetPort: http-metrics, nodePort: 30080 }]
