# Service catalog of profile `local-k8s` (PR-016): the `local` catalog, except that
# production logs come from the real cluster, where every service shares `logs-k8s-*`
# (the Log agent filters on `logs.service_value`, see profiles/local-k8s/profile.yaml).
# `extends: <profile>` = that profile's services.yaml; services merge by name, so only the
# differences are listed.
extends: local

services:
  - name: payment-service
    environments:
      production: { capabilities: { logs: { index_pattern: "logs-k8s-*" } } }
  - name: order-service
    environments:
      production: { capabilities: { logs: { index_pattern: "logs-k8s-*" } } }
  - name: user-service
    environments:
      production: { capabilities: { logs: { index_pattern: "logs-k8s-*" } } }
  - name: inventory-service
    environments:
      production: { capabilities: { logs: { index_pattern: "logs-k8s-*" } } }
