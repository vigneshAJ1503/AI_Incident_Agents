id: S2
title: Memory leak -> OOM restarts (order-service)
description: order-service leaks memory; the JVM throws OutOfMemoryError and the container restarts every few minutes.
question: Orders are failing intermittently in production
service: order-service
environment: production
window: 30m
root_cause: Memory leak in order-service causes OutOfMemoryError and repeated container restarts (OOMKilled).
# Whole investigation (PR-034 evals): the root-cause hypothesis mentions one word of
# every group, with at least min_confidence.
investigation:
  root_cause_keywords: [[memory], [oom, outofmemory], [order-service]]
  min_confidence: 0.7
  severity: high  # report severity (orchestrator.severity rules)
# Per-agent expectations live in agents/<agent>.yaml
